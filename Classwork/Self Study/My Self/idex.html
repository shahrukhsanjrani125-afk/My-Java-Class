<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


    <div class="product-container">
        <div class='product-card'>
            
            <h2>Smart Watch</h2>
            <img src="https://www.paklap.pk/media/catalog/product/cache/702d85193f4c6af6bb773c850e52617f/s/a/samsung-galaxy-l705-ultra-smart-watch-pakistan_4_.png" alt="Product Image">
            <p>Price: $199.99</p>
            <button>Add to Cart</button>
            <button>Buy Now</button>
            <p id="message">This is a smart watch.</p>
        </div>
        <div class='product-card'>
            <img src="https://www.google.com/imgres?q=bike&imgurl=https%3A%2F%2Fcdn.bikedekho.com%2Fprocessedimages%2Fhero-motocorp%2Fhero-motocorp-splendor%2Fsource%2Fhero-motocorp-splendor69ba806bcfb9f.jpg&imgrefurl=https%3A%2F%2Fwww.bikedekho.com%2Fbest-bikes&docid=YBDcYZmC8vXWBM&tbnid=94gLt0SptfMMZM&vet=12ahUKEwjHu_SAn5WWAxVILPsDHYDaKw4QnPAOegQIUxAA..i&w=930&h=620&hcb=2&ved=2ahUKEwjHu_SAn5WWAxVILPsDHYDaKw4QnPAOegQIUxAA" alt="Product Image">
            <h2>Bike</h2>
            <p>Price: $5.000</p>
            <button>Add to Cart</button>
            <button>Buy Now</button>
            <p id="message">This is a bike.</p>
        </div>
        <div class='product-card'>
            <img src="https://www.google.com/imgres?q=laptop&imgurl=https%3A%2F%2Fcdn.bikedekho.com%2Fprocessedimages%2Fhero-motocorp%2Fhero-motocorp-splendor%2Fsource%2Fhero-motocorp-splendor69ba806bcfb9f.jpg&imgrefurl=https%3A%2F%2Fwww.bikedekho.com%2Fbest-bikes&docid=YBDcYZmC8vXWBM&tbnid=94gLt0SptfMMZM&vet=12ahUKEwjHu_SAn5WWAxVILPsDHYDaKw4QnPAOegQIUxAA..i&w=930&h=620&hcb=2&ved=2ahUKEwjHu_SAn5WWAxVILPsDHYDaKw4QnPAOegQIUxAA" alt="Product Image">
            <h2>Laptop</h2>
            <p>Price: $1.000</p>
            <button>Add to Cart</button>
            <button>Buy Now</button>
            <p id="message">This is a laptop.</p>
        </div>
        <div class='product-card'>
            <img src="https://www.google.com/imgres?q=mobile&imgurl=https%3A%2F%2Fwww.paklap.pk%2Fmedia%2Fcatalog%2Fproduct%2Fcache%2F2cc443e44e97595ea39006016c876eaa%2Fs%2Fa%2Fsamsung-galaxy-l705-ultra-smart-watch-pakistan_4_.png" alt="Product Image">
            <h2>Mobile</h2>
            <p>Price: $699.99</p>
            <button>Add to Cart</button>
            <button>Buy Now</button>
            <p id="message">This is a mobile.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
