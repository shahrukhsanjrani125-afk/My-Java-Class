# docker-compose.yml
version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: shark-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: sharkvip123
      MONGO_INITDB_DATABASE: shark_vip
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  tor:
    image: dperson/torproxy
    container_name: shark-tor
    restart: unless-stopped
    environment:
      TOR_ALLOW_RANGE: "0.0.0.0/0"
      TOR_LOG: "notice"
    ports:
      - "9050:9050"
      - "9051:9051"
    volumes:
      - tor_data:/etc/tor

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: shark-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:sharkvip123@mongodb:27017/shark_vip?authSource=admin
      - TOR_HOST=tor
      - FRONTEND_URL=http://frontend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - tor
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: shark-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  tor_data:
  backend_logs: