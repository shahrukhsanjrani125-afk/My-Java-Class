<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign-In</title>

    <style>
        .hero {
            background-image: url("https://i.pcmag.com/imagery/reviews/02disbivpmvtmexkrkxwy0w-13-hero-image-gallery.fit_scale.size_1028x578.v1582749138.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            width: 100%;
            height: 300px;
        }

        h1 {    
            text-align: center;
            color: red;
            font-size: 60px;
        }

        h2 {
            text-align: center;
            color: yellow;
        }

        form {
            text-align: center;
        }

        p {
            text-align: center;
            color: red;
        }
    </style>
</head>

<body>

    <div class="hero"></div>

    <h1>Amazon Prime Sign In</h1>

    <h2>Sign In</h2>

    <form>
        <label for="email">Email or Mobile Number:</label><br>
        <input type="text" id="email" name="email"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <button type="submit">Sign In</button>
    </form>

    <p>Don't have an account?</p>

</body>
</html>
