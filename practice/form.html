<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form </title>

</head>

<body>
        <!-- h1 Mein style = align: center> ye teg alignment deside kr ta hy -->
    <h1 style="text-align: center;">Class Marks Submission</h1>
        <br> 
               <!-- br stand  -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="Letter" required>
            
            <br><br>
            <!-- age mein lebel for=age mein auto number velidation hy -->
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>
            <!-- input type number id represent a numeric input field -->
            <br><br>

            <label for="class">Class:</label>
            <input type="number" id="class" name="class" required>

            <br><br>

            <label for="Feverate Sports">Sports:</label>
            <!-- lebel for gender yani gender clear txt name 
              -->
            <input type="radio" id="male" name="gender" value="male" required>
            <!--Radio id stand for mcqs curcle option jiski vale male yani hm yahan male opt mein tick krein gye   -->

            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
            
            <br> <br>

            <label for="Gender">Gender :</label>
            
            <select id="Gender" name="Gender" required>
                <option value="">Choose</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <br><br>

            <label for="Favorite Sports">Favorite Sports :</label>
            
            <select id="sports" name="sports" required>
                <option value="">Select a sport</option>
                <option value="cricket">Cricket</option>
                <option value="football">Football</option>
                <option value="badminton">Badminton</option>
            </select>

            <br>

            <form>
                <p>Date of Birth: <input type="date"></p>
                <!-- date of barth mein hm input mein ype date jo likha hy 
                 yani input mein date 
                  -->
                <p>Choose File: <input type="file"></p>
                <button type="submit">Submit</button>
            </form>
            
      </body>
</html>
